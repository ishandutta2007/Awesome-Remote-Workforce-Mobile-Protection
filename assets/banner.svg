<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shieldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <!-- Dynamic Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6)); opacity: 0.95; }
        50% { filter: drop-shadow(0 0 22px rgba(168, 85, 247, 0.9)); opacity: 1; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scanLine {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(260px); opacity: 0.2; }
      }
      @keyframes circuitDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes beaconRing {
        0% { r: 10; opacity: 0.8; stroke-width: 2; }
        100% { r: 50; opacity: 0; stroke-width: 0.5; }
      }

      .pulse-shield { animation: pulseGlow 4s infinite ease-in-out; }
      .scanner { animation: scanLine 5s infinite linear; }
      .circuit-line { stroke-dasharray: 8, 8; animation: circuitDash 7s infinite linear; }
      .radar-sweep { transform-origin: 125px 130px; animation: radarSweep 6s infinite linear; }
      .floating-node-1 { animation: floatNode 3.5s infinite ease-in-out; }
      .floating-node-2 { animation: floatNode 4.5s infinite ease-in-out 1s; }
      .beacon { animation: beaconRing 2.5s infinite cubic-bezier(0.2, 0.8, 0.4, 1); }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="260" fill="url(#bgGrad)" rx="16"/>
  <rect width="960" height="260" fill="url(#cyberGrid)" rx="16"/>

  <!-- Scanning Line -->
  <rect class="scanner" x="0" y="0" width="960" height="2" fill="url(#scanGrad)" opacity="0.65"/>

  <!-- Circuit Lines Background -->
  <path class="circuit-line" d="M 125 130 L 225 130 L 255 85 L 360 85" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <path class="circuit-line" d="M 125 130 L 205 185 L 325 185" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <path class="circuit-line" d="M 910 50 L 840 50 L 810 90 L 740 90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
  <path class="circuit-line" d="M 930 200 L 850 200 L 820 160 L 750 160" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Left: Radar & Shield Hub -->
  <g transform="translate(15, 0)">
    <!-- Radar concentric circles -->
    <circle cx="125" cy="130" r="90" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4,4"/>
    <circle cx="125" cy="130" r="65" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="125" cy="130" r="40" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Radar Beacon Wave -->
    <circle class="beacon" cx="125" cy="130" r="10" fill="none" stroke="#38bdf8"/>

    <!-- Radar Rotating Beam -->
    <g class="radar-sweep">
      <path d="M 125 130 L 215 130 A 90 90 0 0 0 125 40 Z" fill="url(#shieldGrad)" opacity="0.12"/>
      <line x1="125" y1="130" x2="215" y2="130" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Glowing Shield + Mobile Icon -->
    <g class="pulse-shield" transform="translate(95, 95) scale(1.4)">
      <!-- Shield Base -->
      <path d="M 21.5 3 L 5 9.5 C 5 21 12 32 21.5 37 C 31 32 38 21 38 9.5 L 21.5 3 Z" fill="url(#shieldGrad)" filter="url(#shieldGlow)" opacity="0.95"/>
      <!-- Inner Shield Details -->
      <path d="M 21.5 6 L 8 11.5 C 8 20.5 13.5 29 21.5 33.5 C 29.5 29 35 20.5 35 11.5 L 21.5 6 Z" fill="#090d16" opacity="0.8"/>
      <!-- Lock Shackle & Body inside Shield -->
      <path d="M 18 16 C 18 14 19 12 21.5 12 C 24 12 25 14 25 16 L 25 18 L 18 18 Z" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
      <rect x="16.5" y="18" width="10" height="8" rx="1.5" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Central Title & Descriptions (Foreground) -->
  <g transform="translate(265, 0)">
    <!-- Top Pill Tag -->
    <g class="floating-node-1" transform="translate(0, 32)">
      <rect x="0" y="0" width="270" height="25" rx="12.5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity="0.85"/>
      <circle cx="14" cy="12.5" r="4" fill="#22c55e"/>
      <text x="28" y="16.5" fill="#a5b4fc" font-size="11" class="sub-text" letter-spacing="1">ZERO TRUST • ZTNA • SASE • MTD</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="102" fill="url(#textGrad)" font-size="28" class="title-text" letter-spacing="0.2">
      Remote Workforce &amp; Mobile Protection
    </text>

    <!-- Subtitle -->
    <text x="0" y="138" fill="#f1f5f9" font-size="14.5" class="sub-text">
      Curated Stack for Zero Trust Access, SASE Architecture &amp; Mobile Threat Defense
    </text>

    <!-- Feature Pillars / Badges -->
    <g transform="translate(0, 172)">
      <!-- Pill 1: ZTNA Architecture -->
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="70" y="18" fill="#bae6fd" font-size="11.5" text-anchor="middle" class="sub-text">🛡️ ZTNA Architecture</text>

      <!-- Pill 2: Mobile Threat Defense -->
      <rect x="150" y="0" width="165" height="28" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="232" y="18" fill="#c7d2fe" font-size="11.5" text-anchor="middle" class="sub-text">📱 Mobile Threat Defense</text>

      <!-- Pill 3: WireGuard Overlays -->
      <rect x="325" y="0" width="150" height="28" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6"/>
      <text x="400" y="18" fill="#e9d5ff" font-size="11.5" text-anchor="middle" class="sub-text">⚡ WireGuard Overlays</text>

      <!-- Pill 4: Enterprise & OSS -->
      <rect x="485" y="0" width="145" height="28" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
      <text x="557" y="18" fill="#a7f3d0" font-size="11.5" text-anchor="middle" class="sub-text">🌐 Enterprise &amp; OSS</text>
    </g>
  </g>

  <!-- Right Decorative Floating Security Nodes -->
  <g class="floating-node-2" transform="translate(820, 50)">
    <circle cx="50" cy="40" r="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
    <text x="50" y="46" font-size="16" text-anchor="middle">💻</text>
    
    <circle cx="15" cy="115" r="16" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" opacity="0.85"/>
    <text x="15" y="121" font-size="14" text-anchor="middle">📱</text>
    
    <circle cx="80" cy="125" r="15" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5" opacity="0.85"/>
    <text x="80" y="131" font-size="13" text-anchor="middle">🔒</text>

    <!-- Node Connector Lines -->
    <line x1="50" y1="40" x2="15" y2="115" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="50" y1="40" x2="80" y2="125" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  </g>

  <!-- Border Gradient Stroke -->
  <rect x="1" y="1" width="958" height="258" fill="none" stroke="url(#textGrad)" stroke-width="1.5" rx="15" opacity="0.45"/>
</svg>